<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,
      user-scalable=no,
      initial-scale=1.0,
      maximum-scale=1.0,
      minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
    <link
      rel="stylesheet"
      href="searchbar.css"
    />
  </head>
  <body>
    <form
      class="searchbar searchbar--large"
      data-qa="big"
    >
      <div class="searchbar__div">
        <div class="searchbar__glass large"></div>
        <input
          class="searchInput searchInput--large"
          type="text"
          data-qa="keypress"
          placeholder='Try "Los Angeles"'
        />
      </div>
    </form>

    <form
      class="searchbar searchbar--small"
      data-qa="small"
    >
      <div
        class="searchbar__div"
        data-qa="hover"
      >
        <div class="searchbar__glass small"></div>
        <input
          class="searchInput searchInput--small"
          type="text"
          placeholder='Try "Los Angeles"'
        />
      </div>
    </form>
  </body>
</html>
